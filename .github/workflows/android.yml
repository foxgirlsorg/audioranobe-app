name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK; AGP installs the missing platform / build-tools itself.
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          # The in-app updater polls this repository's Releases; a fork therefore updates from itself.
          UPDATE_REPO: ${{ github.repository }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: audioranobe-debug
          path: app/build/outputs/apk/debug/*.apk
